<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350" fill="none">
  <defs>
    <radialGradient id="nffGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <circle cx="250" cy="175" r="140" fill="url(#nffGlow)"/>
  <ellipse cx="250" cy="245" rx="130" ry="20" fill="#e2e8f0"/>

  <!-- Menu Board / Stand -->
  <g transform="translate(180, 70)">
    <!-- Board easel legs -->
    <line x1="20" y1="40" x2="-20" y2="180" stroke="#78350f" stroke-width="8" stroke-linecap="round"/>
    <line x1="120" y1="40" x2="160" y2="180" stroke="#78350f" stroke-width="8" stroke-linecap="round"/>
    <line x1="70" y1="20" x2="70" y2="175" stroke="#92400e" stroke-width="6" stroke-linecap="round"/>

    <!-- Chalkboard frame -->
    <rect x="0" y="25" width="140" height="110" rx="8" fill="#451a03" stroke="#78350f" stroke-width="6"/>
    <rect x="10" y="35" width="120" height="90" rx="4" fill="#1c1917"/>

    <!-- Chalk Text / Icon -->
    <ellipse cx="70" cy="65" rx="18" ry="12" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="3,2"/>
    <path d="M60,65 Q70,75 80,65" stroke="#fef08a" stroke-width="2" fill="none"/>
    <circle cx="65" cy="60" r="2" fill="#fef08a"/>
    <circle cx="75" cy="60" r="2" fill="#fef08a"/>
    <text x="70" y="105" font-family="'Courier New', monospace" font-size="11" fill="#fed7aa" text-anchor="middle" font-weight="bold">
      OUT OF DISHES
    </text>
  </g>

  <!-- Magnifying glass looking for food -->
  <g transform="translate(290, 180) rotate(-20)">
    <circle cx="30" cy="30" r="24" fill="#fed7aa" fill-opacity="0.3" stroke="url(#warmGrad)" stroke-width="6"/>
    <line x1="48" y1="48" x2="75" y2="75" stroke="url(#warmGrad)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="24" cy="24" r="5" fill="#ea580c" opacity="0.6"/>
  </g>
</svg>
