<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="1100" height="240" fill="none">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="50%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Background container with rounded corners and warm glow -->
  <rect width="1100" height="240" rx="20" fill="url(#bannerBg)"/>

  <!-- Decorative spicy/warm circles -->
  <circle cx="1020" cy="40" r="140" fill="#ea580c" opacity="0.2"/>
  <circle cx="80" cy="220" r="100" fill="#f59e0b" opacity="0.15"/>
  <circle cx="950" cy="180" r="80" fill="#fbbf24" opacity="0.1"/>

  <!-- Badge: MAAZA PRIME -->
  <g transform="translate(60, 42)">
    <rect width="180" height="34" rx="8" fill="url(#badgeGrad)"/>
    <text x="90" y="23" font-family="'Outfit', 'Roboto', sans-serif" font-weight="900" font-size="14" fill="#ffffff" letter-spacing="2" text-anchor="middle">
      CHEF'S SPECIALS
    </text>
  </g>

  <!-- Heading -->
  <text x="60" y="125" font-family="'Outfit', 'Roboto', sans-serif" font-weight="800" font-size="36" fill="#ffffff" letter-spacing="0.5">
    Exclusive Signature Delicacies
  </text>

  <!-- Description -->
  <text x="60" y="165" font-family="'Roboto', sans-serif" font-weight="400" font-size="18" fill="#fed7aa">
    Handcrafted daily with royal heritage recipes. Enjoy special member deals on Biryanis, Chai & Sweets!
  </text>

  <!-- CTA pill -->
  <g transform="translate(60, 185)">
    <text x="0" y="18" font-family="'Roboto', sans-serif" font-weight="700" font-size="14" fill="#fbbf24" letter-spacing="1">
      HOT & FRESH GUARANTEE • AUTHENTIC TASTE • SPECIAL COMBO OFFERS
    </text>
  </g>

  <!-- Right illustration: Golden Chef Hat & Dish Cloche -->
  <g transform="translate(860, 40)">
    <!-- Plate base -->
    <ellipse cx="100" cy="140" rx="90" ry="16" fill="#fb923c" opacity="0.4"/>
    <ellipse cx="100" cy="135" rx="80" ry="12" fill="#fed7aa"/>

    <!-- Cloche -->
    <path d="M45,130 C45,65 75,45 100,45 C125,45 155,65 155,130 Z" fill="#ffffff"/>
    <ellipse cx="100" cy="130" rx="55" ry="8" fill="#f1f5f9"/>
    <circle cx="100" cy="40" r="8" fill="#f59e0b"/>

    <!-- Sparkles -->
    <circle cx="35" cy="50" r="3" fill="#fbbf24"/>
    <circle cx="165" cy="45" r="4" fill="#fbbf24"/>
    <circle cx="100" cy="15" r="2.5" fill="#f59e0b"/>
  </g>
</svg>
